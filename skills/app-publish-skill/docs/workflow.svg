<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">App Publish Skill: input to output</title>
<desc id="desc">Original workflow illustration, with synthetic UI. Inputs: App repository + current contracts; Platform, track and authorized endpoint; Signing setup + fresh store baseline. Stages: Freeze identity; Build locally; Inspect artifact; Deliver + record. Output: Source + artifact identity · stage-specific evidence. No device or provider verification is implied.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1440" height="800" rx="0" fill="#f4f5ee" stroke="none"/>
<rect x="0" y="0" width="1440" height="10" rx="0" fill="#163d33" stroke="none"/>
<text x="48" y="53" font-size="18" fill="#5c7067" font-weight="600">APP DEV SKILLS   /   05</text>
<text x="48" y="111" font-size="44" fill="#163d33" font-weight="700">App Publish Skill</text>
<text x="48" y="151" font-size="22" fill="#5c7067" font-weight="400">Deliver the requested stage with exact identity.</text>
<rect x="48" y="193" width="634" height="360" rx="18" fill="#e7ecdf" stroke="none"/>
<text x="76" y="238" font-size="17" fill="#5c7067" font-weight="700">START WITH</text>
<rect x="76" y="263" width="28" height="28" rx="14" fill="#163d33" stroke="none"/>
<text x="85" y="283" font-size="16" fill="white" font-weight="600">1</text>
<text x="120" y="285" font-size="22" fill="#163d33" font-weight="400">App repository + current contracts</text>
<rect x="76" y="326" width="28" height="28" rx="14" fill="#163d33" stroke="none"/>
<text x="85" y="346" font-size="16" fill="white" font-weight="600">2</text>
<text x="120" y="348" font-size="22" fill="#163d33" font-weight="400">Platform, track and authorized endpoint</text>
<rect x="76" y="389" width="28" height="28" rx="14" fill="#163d33" stroke="none"/>
<text x="85" y="409" font-size="16" fill="white" font-weight="600">3</text>
<text x="120" y="411" font-size="22" fill="#163d33" font-weight="400">Signing setup + fresh store baseline</text>
<text x="76" y="510" font-size="20" fill="#5c7067" font-weight="400">Your materials set the scope and the stopping point.</text>
<rect x="734" y="199" width="636" height="350" rx="18" fill="#163d33" stroke="none"/>
<text x="761" y="240" font-size="18" fill="#d4ee95" font-weight="600">RELEASE RECORD</text>
<text x="761" y="286" font-size="18" fill="#b8c9b7" font-weight="600">source</text>
<text x="883" y="286" font-size="19" fill="white" font-weight="400">pushed commit + clean worktree</text>
<text x="761" y="337" font-size="18" fill="#b8c9b7" font-weight="600">artifact</text>
<text x="883" y="337" font-size="19" fill="white" font-weight="400">bundle ID · version/build · SHA-256</text>
<text x="761" y="388" font-size="18" fill="#b8c9b7" font-weight="600">checks</text>
<text x="883" y="388" font-size="19" fill="white" font-weight="400">contents · signing · required assets</text>
<text x="761" y="439" font-size="18" fill="#b8c9b7" font-weight="600">endpoint</text>
<text x="883" y="439" font-size="19" fill="white" font-weight="400">exact authorized delivery stage</text>
<rect x="758" y="475" width="587" height="48" rx="10" fill="#2f5647" stroke="none"/>
<text x="778" y="506" font-size="18" fill="white" font-weight="600">Provider receipt ≠ tester access ≠ public release</text>
<rect x="48" y="592" width="315" height="66" rx="12" fill="white" stroke="#d6dfd3"/>
<text x="67" y="633" font-size="20" fill="#5c7067" font-weight="600">01</text>
<text x="109" y="633" font-size="22" fill="#163d33" font-weight="600">Freeze identity</text>
<text x="368" y="632" font-size="25" fill="#5c7067" font-weight="400">›</text>
<rect x="391" y="592" width="315" height="66" rx="12" fill="white" stroke="#d6dfd3"/>
<text x="410" y="633" font-size="20" fill="#5c7067" font-weight="600">02</text>
<text x="452" y="633" font-size="22" fill="#163d33" font-weight="600">Build locally</text>
<text x="711" y="632" font-size="25" fill="#5c7067" font-weight="400">›</text>
<rect x="734" y="592" width="315" height="66" rx="12" fill="white" stroke="#d6dfd3"/>
<text x="753" y="633" font-size="20" fill="#5c7067" font-weight="600">03</text>
<text x="795" y="633" font-size="22" fill="#163d33" font-weight="600">Inspect artifact</text>
<text x="1054" y="632" font-size="25" fill="#5c7067" font-weight="400">›</text>
<rect x="1077" y="592" width="315" height="66" rx="12" fill="white" stroke="#d6dfd3"/>
<text x="1096" y="633" font-size="20" fill="#5c7067" font-weight="600">04</text>
<text x="1138" y="633" font-size="22" fill="#163d33" font-weight="600">Deliver + record</text>
<text x="48" y="707" font-size="17" fill="#5c7067" font-weight="700">DELIVER</text>
<text x="178" y="707" font-size="25" fill="#163d33" font-weight="600">Source + artifact identity · stage-specific evidence</text>
<text x="48" y="766" font-size="16" fill="#5c7067" font-weight="400">WORKFLOW ILLUSTRATION · SYNTHETIC UI · NOT A PRODUCT VALIDATION OR PROVIDER RECEIPT</text>
</g>
